name: image

on:
  push:
    branches:
      - main

permissions:
  contents: write
  packages: write

concurrency:
  group: image-main
  cancel-in-progress: false

jobs:
  publish:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out the commit that was pushed
        uses: actions/checkout@v4

      - name: Log in to GHCR
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Register arm64 emulation
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Build and push the commit SHA
        run: |
          # GitHub's runner is amd64. The kind nodes on this Mac are arm64.
          # The first published tag was an amd64 image plus an attestation
          # manifest, and the nodes refused it: no matching platform.
          # provenance and sbom stay off so the tag is one arm64 image.
          image="ghcr.io/aradperl/devops-engineer-technical-exercise:${{ github.sha }}"
          docker buildx create --name exercise --driver docker-container --use
          docker buildx build \
            --platform linux/arm64 \
            --provenance=false \
            --sbom=false \
            --label org.opencontainers.image.source="${{ github.server_url }}/${{ github.repository }}" \
            --tag "$image" \
            --push \
            .

      - name: Make the package public
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # /user/packages is for a personal token. The Actions token is not a
          # user, so that path returned 404 on the first run. This is the
          # package that belongs to the Aradperl account.
          pkg="/users/Aradperl/packages/container/devops-engineer-technical-exercise"
          for attempt in 1 2 3 4 5 6; do
            visibility=$(gh api "$pkg" --jq .visibility 2>/dev/null || true)
            if [ "$visibility" = "public" ]; then
              echo "Package is public."
              exit 0
            fi
            gh api --method PATCH \
              -H "Accept: application/vnd.github+json" \
              "$pkg" \
              -f visibility=public || true
            echo "Attempt ${attempt}: package is not public yet."
            sleep 5
          done
          echo "Set the package to public, then re-run this job:"
          echo "https://github.com/users/Aradperl/packages/container/devops-engineer-technical-exercise/settings"
          exit 1

      - name: Write the image tag into the Deployment
        run: |
          image="ghcr.io/aradperl/devops-engineer-technical-exercise:${{ github.sha }}"
          sed -i -E "s|(image: ).*|\1${image}|" deploy/web/deployment.yaml
          sed -i -E "s|(imagePullPolicy: ).*|\1IfNotPresent|" deploy/web/deployment.yaml
          grep -n -E 'image:|imagePullPolicy:' deploy/web/deployment.yaml

      - name: Commit the tag back to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add deploy/web/deployment.yaml
          if git diff --cached --quiet; then
            echo "Deployment already points at this image."
            exit 0
          fi
          git commit -m "Roll the web image to ${{ github.sha }}"
          git push origin HEAD:main
